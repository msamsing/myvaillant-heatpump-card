      <path d="M219 409C209 385 218 371 231 370C236 388 231 400 219 409Z" fill="#8BD7EF" opacity="0.9"/>
      <path d="M219 409C244 405 255 416 251 429C233 431 224 423 219 409Z" fill="#8BD7EF" opacity="0.9"/>
      <path d="M219 409C204 429 189 431 182 420C194 405 207 403 219 409Z" fill="#8BD7EF" opacity="0.9"/>
      <circle cx="219" cy="409" r="8" fill="#172026" stroke="#8BD7EF" stroke-width="4"/>
