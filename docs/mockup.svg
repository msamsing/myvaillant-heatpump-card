<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(174 220) rotate(49) scale(520 390)">
      <stop stop-color="#24A6D4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#24A6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 196) rotate(131) scale(440 330)">
      <stop stop-color="#F4AC40" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F4AC40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="84" y1="70" x2="1116" y2="1430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="0.48" stop-color="#172026"/>
      <stop offset="1" stop-color="#1D2B2E"/>
    </linearGradient>
    <linearGradient id="pipeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4DB7D8"/>
      <stop offset="0.35" stop-color="#4EE1A0"/>
      <stop offset="0.7" stop-color="#F4AC40"/>
      <stop offset="1" stop-color="#F06948"/>
    </linearGradient>
    <linearGradient id="tankFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFDD7E"/>
      <stop offset="1" stop-color="#F06948"/>
    </linearGradient>
    <linearGradient id="houseFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BD7EF"/>
      <stop offset="1" stop-color="#4EE1A0"/>
    </linearGradient>
    <filter id="softShadow" x="36" y="26" width="1128" height="1190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <style>
      .title { font: 850 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .subtitle { font: 500 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(247,251,255,0.72); }
      .eyebrow { font: 800 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #8BD7EF; }
      .sectionTitle { font: 850 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .label { font: 800 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(247,251,255,0.82); }
      .tiny { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(247,251,255,0.62); letter-spacing: 0.7px; }
      .value { font: 850 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .rowText { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(247,251,255,0.76); }
      .rowValue { font: 780 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; text-anchor: end; }
      .panelStroke { stroke: rgba(255,255,255,0.12); }
      .softPanel { fill: rgba(255,255,255,0.075); stroke: rgba(255,255,255,0.11); }
      .componentPanel { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.13); }
      .pipeFlow { animation: dash 1.35s linear infinite; }
      .fan { transform-origin: 219px 384px; animation: spin 1.45s linear infinite; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -86; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    </style>
