    <line x1="636" y1="868" x2="1048" y2="868" stroke="rgba(255,255,255,0.08)"/>
    <text x="648" y="890" class="rowText">Ønsket temperatur</text><text x="1044" y="890" class="rowValue">21.5 C</text>
  </g>

  <g>
