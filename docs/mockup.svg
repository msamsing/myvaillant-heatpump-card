    <line x1="152" y1="996" x2="564" y2="996" stroke="rgba(255,255,255,0.08)"/>
    <text x="164" y="1026" class="rowText">Tanktemperatur</text><text x="560" y="1026" class="rowValue">48.6 C</text>
    <line x1="152" y1="1052" x2="564" y2="1052" stroke="rgba(255,255,255,0.08)"/>
